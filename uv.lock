version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "deeper-dive"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "textual" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [{ name = "textual", specifier = ">=6,<7" }]

[package.metadata.requires-dev]
dev = [
    { name = "mypy", specifier = ">=1.18,<2" },
    { name = "pytest", specifier = ">=8.4,<9" },
    { name = "pytest-asyncio", specifier = ">=1.2,<2" },
    { name = "ruff", specifier = ">=0.13,<0.14" },
]
