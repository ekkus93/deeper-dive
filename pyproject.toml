[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deeper-dive"
version = "0.1.0"
description = "A terminal-first NotebookLM-style deep-dive application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pypdf>=6.19,<7",
  "textual>=6,<7",
]

[project.scripts]
deeper-dive = "deeper_dive.command:main"
deeper-dive-tui = "deeper_dive.tui:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deeper_dive"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "tests/test_preflight_routing.py",
  "tests/test_quick_deep_dive.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["deeper_dive"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "deeper_dive.transcript_review_screen"
disable_error_code = ["index"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
