name: DD-032 lock refresh

on:
  push:
    branches:
      - ralph/dd-032-pdf-ingestion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-032-pdf-ingestion
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv lock
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
          else
            git commit -m "ci: refresh DD-032 uv lock"
            git push origin HEAD:ralph/dd-032-pdf-ingestion
          fi
