name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile DD-130 TODO
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/DEEP_DIVE_TUI_TODO.md')
          text = path.read_text()
          start = text.index('## DD-130 — Audio decode/normalization')
          end = text.index('## DD-131 — Audio timeline model', start)
          block = text[start:end].replace('- [ ] ', '- [x] ')
          path.write_text(text[:start] + block + text[end:])
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add docs/DEEP_DIVE_TUI_TODO.md
            git commit -m "docs: reconcile DD-130 completion"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Validate dependency lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Static typing
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: CLI/import smoke
        run: |
          uv run deeper-dive --help
          uv run python -c "import deeper_dive; print(deeper_dive.__version__)"
