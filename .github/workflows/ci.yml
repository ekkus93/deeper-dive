name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile DD-132 TODO
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/DEEP_DIVE_TUI_TODO.md')
          text = path.read_text()
          start = text.index('## DD-132 — TTS generation stage')
          end = text.index('## DD-133 — FFmpeg integration', start)
          section = text[start:end].replace('- [ ]', '- [x]')
          path.write_text(text[:start] + section + text[end:])
          PY
      - name: Commit reconciliation
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add docs/DEEP_DIVE_TUI_TODO.md
            git commit -m "docs: reconcile DD-132 completion"
            git push
          fi
