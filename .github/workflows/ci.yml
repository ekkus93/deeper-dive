name: Format DD-123

on:
  push:
    branches: [ralph/dd-123-kitten-voice-preview]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-123-kitten-voice-preview
      - uses: astral-sh/setup-uv@v6
      - name: Format implementation
        run: |
          uv sync --frozen
          uv run ruff format src/deeper_dive/voice_preview.py tests/test_voice_preview.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/deeper_dive/voice_preview.py tests/test_voice_preview.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format DD-123 with Ruff'
            git push origin HEAD:ralph/dd-123-kitten-voice-preview
          fi
