name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconcile DD-106 TODO
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/DEEP_DIVE_TUI_TODO.md')
          s = p.read_text()
          start = s.index('## DD-106')
          end = s.index('\n---', start)
          s = s[:start] + s[start:end].replace('- [ ]', '- [x]') + s[end:]
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md
          git diff --cached --quiet || git commit -m 'docs: reconcile DD-106 completion'
          git push
