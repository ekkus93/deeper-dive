name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-143-reconcile
      - name: Reconcile DD-143 TODO
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/DEEP_DIVE_TUI_TODO.md")
          text = path.read_text()
          start = text.index("## DD-143 — Preflight service")
          end = text.index("# Milestone 16", start)
          block = text[start:end]
          updated = block.replace("- [ ]", "- [x]")
          if updated == block:
              raise SystemExit("DD-143 block already reconciled")
          path.write_text(text[:start] + updated + text[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md
          git commit -m "docs: reconcile DD-143 completion"
          git push origin HEAD:ralph/dd-143-reconcile
