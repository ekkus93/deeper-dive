name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen
      - name: Ruff format diff
        run: uv run ruff format --diff src/deeper_dive/preflight.py tests/test_preflight.py
