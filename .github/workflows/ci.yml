name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Format DD-106
        run: |
          uv run ruff format src/deeper_dive/conversation_quality.py tests/test_conversation_quality.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/deeper_dive/conversation_quality.py tests/test_conversation_quality.py
          git diff --cached --quiet || git commit -m "style: format DD-106 quality heuristics"
          git push
