name: CI
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md'); s=p.read_text()
          a=s.index('## DD-104 — Host turn generation'); b=s.index('## DD-105 — Duration and pacing controller',a)
          p.write_text(s[:a]+s[a:b].replace('- [ ]','- [x]')+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add . && git commit -m "docs: reconcile DD-104 completion" && git push
