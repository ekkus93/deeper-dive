name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check --fix --diff src/deeper_dive/pipeline.py tests/test_pipeline.py
