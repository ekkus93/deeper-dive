name: CI
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md'); s=p.read_text()
          a=s.index('## DD-135 — Partial audio regeneration'); b=s.index('# Milestone 15', a)
          p.write_text(s[:a]+s[a:b].replace('- [ ] ', '- [x] ')+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md && git commit -m "docs: reconcile DD-135 completion" && git push
