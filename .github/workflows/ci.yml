name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format .
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add .
            git commit -m "style: format DD-132 TTS generation"
            git push
          fi
