name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Validate dependency lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Apply persistence fix, format, and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/deeper_dive/episode_planner.py')
          text = path.read_text()
          text = text.replace('from deeper_dive.storage.episode_repositories import (', 'from deeper_dive.storage.episode_plan_repository import EpisodePlanRepository\nfrom deeper_dive.storage.episode_repositories import (')
          text = text.replace('self.repository = HostEpisodeRepository(database)\n        self.retrieval', 'self.repository = HostEpisodeRepository(database)\n        self.plan_repository = EpisodePlanRepository(database)\n        self.retrieval')
          text = text.replace('self.repository.save_plan(record, segments)', 'self.plan_repository.replace(record, segments)')
          path.write_text(text)
          PY
          uv run ruff format .
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add .
            git commit -m "fix: replace persisted episode plans atomically"
            git push
          fi
      - name: Ruff lint
        run: uv run ruff check .
      - name: Static typing
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: CLI/import smoke
        run: |
          uv run deeper-dive --help
          uv run python -c "import deeper_dive; print(deeper_dive.__version__)"
