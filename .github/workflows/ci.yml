name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Apply Ruff formatting
        if: github.event_name == 'pull_request'
        run: |
          uv run ruff format src/deeper_dive/director.py tests/test_director.py
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add src/deeper_dive/director.py tests/test_director.py
            git commit -m 'style: format DD-102 director engine'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Static typing
        run: uv run mypy
      - name: Tests
        run: uv run pytest
