name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --frozen
      - name: CLI help smoke
        run: uv run deeper-dive --help
      - name: Import smoke
        run: uv run python -c "import deeper_dive; print(deeper_dive.__version__)"
