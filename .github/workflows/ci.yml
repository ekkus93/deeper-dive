name: CI
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/deeper_dive/host_turn.py')
          s=p.read_text()
          s=s.replace('"SELECT * FROM conversation_turns WHERE episode_id=? ORDER BY segment_ordinal,turn_ordinal",', '"SELECT * FROM conversation_turns WHERE episode_id=? "\n                "ORDER BY segment_ordinal,turn_ordinal",')
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add . && git commit -m "style: bound DD-104 query line" && git push
