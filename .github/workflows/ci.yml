name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Validate dependency lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Apply DD-151 stage-marker fix
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/deeper_dive/generation_monitor.py")
          text = source.read_text()
          text = text.replace(
              "f\"{'[x]' if stage in snapshot.completed_stages else '[ ]'} {stage}\"",
              "f\"{'✓' if stage in snapshot.completed_stages else '○'} {stage}\"",
          )
          source.write_text(text)
          test = Path("tests/test_generation_monitor.py")
          text = test.read_text().replace('"[x] sources"', '"✓ sources"').replace('"[ ] research"', '"○ research"')
          test.write_text(text)
          PY
          uv run ruff format src/deeper_dive/generation_monitor.py tests/test_generation_monitor.py
          git config user.name "chatgpt-ralph-bridge[bot]"
          git config user.email "326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com"
          git add src/deeper_dive/generation_monitor.py tests/test_generation_monitor.py
          git commit -m "fix: render visible generation stage markers"
          git push origin HEAD:${{ github.head_ref }}
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Static typing
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: CLI/import smoke
        run: |
          uv run deeper-dive --help
          uv run python -c "import deeper_dive; print(deeper_dive.__version__)"
