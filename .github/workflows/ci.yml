name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile DD-124 completion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/DEEP_DIVE_TUI_TODO.md")
          text = path.read_text()
          start = text.index("## DD-124 — KittenTTS benchmark")
          end = text.index("## DD-125 — OpenAI TTS adapter", start)
          section = text[start:end].replace("- [ ]", "- [x]")
          path.write_text(text[:start] + section + text[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: reconcile DD-124 completion"
            git push origin HEAD:${{ github.head_ref }}
          fi
