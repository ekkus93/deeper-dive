name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile DD-105
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md')
          s=p.read_text()
          start=s.index('## DD-105 — Duration and pacing controller')
          end=s.index('## DD-106 — Conversation quality heuristics')
          section=s[start:end].replace('- [ ] ', '- [x] ')
          p.write_text(s[:start]+section+s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md
          git diff --cached --quiet || git commit -m "docs: reconcile DD-105 completion"
          git push
