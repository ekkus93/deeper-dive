name: Format DD-122

on:
  push:
    branches: [ralph/dd-122-kitten-model-manager]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-122-kitten-model-manager
      - uses: astral-sh/setup-uv@v6
      - name: Format implementation
        run: |
          uv sync --frozen --group dev
          uv run ruff format src/deeper_dive/kitten_model_manager.py tests/test_kitten_model_manager.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/deeper_dive/kitten_model_manager.py tests/test_kitten_model_manager.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format DD-122 with Ruff'
            git push origin HEAD:ralph/dd-122-kitten-model-manager
          fi
