name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile DD-113
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/DEEP_DIVE_TUI_TODO.md')
          text = p.read_text()
          start = text.index('## DD-113 — Targeted repair')
          end = text.index('## DD-114 — Claim inspector TUI')
          block = text[start:end].replace('- [ ]', '- [x]')
          p.write_text(text[:start] + block + text[end:])
          PY
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add docs/DEEP_DIVE_TUI_TODO.md
            git commit -m "docs: reconcile DD-113 completion"
            git push
          fi
