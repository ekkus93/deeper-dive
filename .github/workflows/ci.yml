name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconcile DD-102 TODO
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md'); t=p.read_text(); a=t.index('## DD-102 — Director engine'); b=t.index('## DD-103 — Host prompt/context assembly'); p.write_text(t[:a]+t[a:b].replace('- [ ]','- [x]')+t[b:])
          PY
          if ! git diff --quiet; then git config user.name github-actions; git config user.email actions@github.com; git add docs/DEEP_DIVE_TUI_TODO.md; git commit -m 'docs: reconcile DD-102 completion'; git push origin HEAD:${{ github.head_ref }}; fi
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
