name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Validate dependency lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Static typing
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: CLI/import smoke
        run: |
          uv run deeper-dive --help
          uv run python -c "import deeper_dive; print(deeper_dive.__version__)"

  fresh-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Install fresh prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          uv python install 3.12
      - name: Build and install wheel in clean environment
        run: |
          uv build
          uv venv /tmp/deeper-dive-fresh --python 3.12
          uv pip install --python /tmp/deeper-dive-fresh/bin/python dist/*.whl
      - name: Launch installed CLI and TUI entry points
        run: |
          /tmp/deeper-dive-fresh/bin/deeper-dive --help
          timeout 5s /tmp/deeper-dive-fresh/bin/deeper-dive-tui || test $? -eq 124
      - name: Exercise installed-wheel corpus and episode workflow
        run: |
          export PATH="/tmp/deeper-dive-fresh/bin:$PATH"
          export DEEPER_DIVE_DATA_DIR=/tmp/deeper-dive-smoke
          mkdir -p /tmp/fresh-corpus /tmp/fresh-exports
          printf '# Fresh corpus\n\nA small synthetic source for fresh-machine qualification.\n' > /tmp/fresh-corpus/source.md
          deeper-dive --json project create "Fresh machine smoke" > /tmp/project.json
          PROJECT_ID="$(/tmp/deeper-dive-fresh/bin/python -c 'import json; print(json.load(open("/tmp/project.json"))["id"])')"
          deeper-dive --json source add "$PROJECT_ID" /tmp/fresh-corpus > /tmp/sources.json
          deeper-dive --json host create "$PROJECT_ID" curious_explainer > /tmp/host.json
          HOST_ID="$(/tmp/deeper-dive-fresh/bin/python -c 'import json; print(json.load(open("/tmp/host.json"))["id"])')"
          deeper-dive --json episode create "$PROJECT_ID" --title "Fresh smoke episode" --focus "Explain the synthetic source" --duration 60 --hosts "$HOST_ID" --research-policy off > /tmp/episode.json
          EPISODE_ID="$(/tmp/deeper-dive-fresh/bin/python -c 'import json; print(json.load(open("/tmp/episode.json"))["id"])')"
          deeper-dive --json episode plan "$PROJECT_ID" "$EPISODE_ID" > /tmp/plan.json
          deeper-dive --json episode generate "$PROJECT_ID" "$EPISODE_ID" > /tmp/run.json
          deeper-dive --json episode export "$PROJECT_ID" "$EPISODE_ID" --output-dir /tmp/fresh-exports > /tmp/export.json
          /tmp/deeper-dive-fresh/bin/python - <<'PY'
          import json
          from pathlib import Path
          sources = json.load(open("/tmp/sources.json"))
          plan = json.load(open("/tmp/plan.json"))
          run = json.load(open("/tmp/run.json"))
          exported = json.load(open("/tmp/export.json"))
          assert len(sources["imported"]) == 1
          assert plan["segments"]
          assert run["state"] == "completed"
          assert run["stage"] == "export"
          assert Path(exported["path"]).is_file()
          PY
      - name: Install real KittenTTS runtime
        run: |
          uv pip install --python /tmp/deeper-dive-fresh/bin/python \
            https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl
      - name: Real KittenTTS Micro CPU smoke
        run: |
          /tmp/deeper-dive-fresh/bin/python - <<'PY'
          from deeper_dive.kitten_tts import KittenTTSMicroProvider
          from deeper_dive.tts import TTSRequest

          provider = KittenTTSMicroProvider()
          result = provider.synthesize(TTSRequest("Fresh machine CPU smoke.", "Bella"))
          assert result.provider == "kitten"
          assert result.audio.startswith(b"RIFF")
          assert result.sample_rate_hz == 24000
          print(f"KittenTTS Micro CPU smoke: {len(result.audio)} WAV bytes")
          PY
