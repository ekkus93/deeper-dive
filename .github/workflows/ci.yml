name: CI
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: |
          uv run ruff format tests/test_material_claims.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add tests/test_material_claims.py
          git diff --cached --quiet || git commit -m 'style: format DD-110 fixture fix'
          git push
