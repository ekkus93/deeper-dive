name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Format and commit
        run: |
          uv run ruff format tests/test_elevenlabs_tts.py
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add tests/test_elevenlabs_tts.py
            git commit -m "style: apply Ruff formatting to DD-127 tests"
            git push
          fi
