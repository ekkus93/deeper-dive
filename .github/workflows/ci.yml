name: CI
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Fix and commit
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add .
          git commit -m "style: apply DD-104 lint fixes"
          git push
