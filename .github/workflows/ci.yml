name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Apply DD-100 schema migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/deeper_dive/storage/database.py')
          text = path.read_text()
          text = text.replace('LATEST_SCHEMA_VERSION = 4', 'LATEST_SCHEMA_VERSION = 5')
          needle = '''    Migration(\n        version=4,\n        statements=(\n            """CREATE TABLE generation_runs'''
          if 'version=5' not in text:
              marker = '\n)\n\n\nclass Database:'
              migration = '''\n    Migration(\n        version=5,\n        statements=(\n            """CREATE TABLE conversation_states (\n                episode_id TEXT PRIMARY KEY REFERENCES episodes(id) ON DELETE CASCADE,\n                segment_ordinal INTEGER NOT NULL DEFAULT 0 CHECK(segment_ordinal >= 0),\n                segment_turn INTEGER NOT NULL DEFAULT 0 CHECK(segment_turn >= 0),\n                running_summary TEXT NOT NULL DEFAULT '',\n                unresolved_topics_json TEXT NOT NULL DEFAULT '[]',\n                recent_context_refs_json TEXT NOT NULL DEFAULT '[]',\n                participation_json TEXT NOT NULL DEFAULT '{}'\n            )""",\n        ),\n    ),\n'''
              text = text.replace(marker, migration + marker)
          path.write_text(text)
          PY
          uv run ruff format .
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add .
            git commit -m "DD-100: add conversation state schema migration"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Validate dependency lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Static typing
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: CLI/import smoke
        run: |
          uv run deeper-dive --help
          uv run python -c "import deeper_dive; print(deeper_dive.__version__)"
