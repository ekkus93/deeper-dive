name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile DD-140 TODO
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/DEEP_DIVE_TUI_TODO.md')
          s = p.read_text()
          start = s.index('## DD-140 — Pipeline stage orchestrator')
          end = s.index('## DD-141 — Pause/resume/cancel', start)
          section = s[start:end]
          section = section.replace('- [ ] ', '- [x] ')
          p.write_text(s[:start] + section + s[end:])
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md
          git commit -m 'docs: reconcile DD-140 completion'
          git push origin HEAD:${{ github.head_ref }}
