name: Reconcile DD-122

on:
  push:
    branches: [ralph/dd-122-reconcile]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-122-reconcile
      - name: Reconcile authoritative TODO
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/DEEP_DIVE_TUI_TODO.md')
          s = p.read_text()
          start = s.index('## DD-122 — KittenTTS model manager')
          end = s.index('## DD-123 — KittenTTS voice preview')
          section = s[start:end].replace('- [ ]', '- [x]')
          p.write_text(s[:start] + section + s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: reconcile DD-122 completion'
            git push origin HEAD:ralph/dd-122-reconcile
          fi
