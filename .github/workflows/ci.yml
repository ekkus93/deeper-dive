name: CI
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile DD-133
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md')
          s=p.read_text()
          start=s.index('## DD-133 — FFmpeg integration')
          end=s.index('## DD-134 — Export artifacts', start)
          block=s[start:end].replace('- [ ] ', '- [x] ')
          p.write_text(s[:start]+block+s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md
          git commit -m "docs: reconcile DD-133 completion"
          git push
