name: CI
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md'); t=p.read_text()
          a=t.index('## DD-114 — Claim inspector TUI'); b=t.index('# Milestone 13')
          p.write_text(t[:a]+t[a:b].replace('- [ ]','- [x]')+t[b:])
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/DEEP_DIVE_TUI_TODO.md && git commit -m "docs: reconcile DD-114 completion" && git push
