name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Reconcile DD-151 TODO
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/DEEP_DIVE_TUI_TODO.md")
          text = path.read_text()
          start = text.index("## DD-151 — Generation monitor")
          end = text.index("## DD-152 — Episode library TUI", start)
          section = text[start:end].replace("- [ ]", "- [x]")
          path.write_text(text[:start] + section + text[end:])
          PY
          git config user.name "chatgpt-ralph-bridge[bot]"
          git config user.email "326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com"
          git add docs/DEEP_DIVE_TUI_TODO.md
          git commit -m "docs: reconcile DD-151 completion"
          git push origin HEAD:${{ github.head_ref }}
      - name: Validate dependency lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Static typing
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: CLI/import smoke
        run: |
          uv run deeper-dive --help
          uv run python -c "import deeper_dive; print(deeper_dive.__version__)"
