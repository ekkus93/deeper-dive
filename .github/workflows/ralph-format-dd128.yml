name: Ralph format DD-128
on:
  push:
    branches: [ralph/dd-128-host-tts-ui-2]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format src/deeper_dive/hosts_screen.py src/deeper_dive/provider_tui.py tests/test_hosts_screen.py
      - run: |
          rm .github/workflows/ralph-format-dd128.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/deeper_dive/hosts_screen.py src/deeper_dive/provider_tui.py tests/test_hosts_screen.py .github/workflows/ralph-format-dd128.yml
          git commit -m 'style: format DD-128 host TTS UI'
          git push
