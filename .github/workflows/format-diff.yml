name: Format Diff

on:
  push:
    branches:
      - master

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Show Ruff format diff
        run: uv run ruff format --diff .
