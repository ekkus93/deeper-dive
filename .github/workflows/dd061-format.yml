name: DD-061 formatter
on:
  push:
    branches: [ralph/dd-061-secret-storage]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-061-secret-storage
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format src/deeper_dive/secrets.py tests/test_secrets.py
      - run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/deeper_dive/secrets.py tests/test_secrets.py
            git commit -m 'style: format DD-061'
            git push
          fi
