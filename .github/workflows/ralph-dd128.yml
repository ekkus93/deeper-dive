name: Ralph implement DD-128
on:
  push:
    branches: [ralph/dd-128-host-tts-ui-2]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Implement host TTS UI completion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/deeper_dive/provider_tui.py')
          s=p.read_text()
          s=s.replace('from typing import Protocol\n\nfrom deeper_dive.llm', 'from deeper_dive.llm')
          a=s.index('\n\nclass TTSProvider(Protocol):')
          b=s.index('\n\n@dataclass', a)
          s=s[:a]+'\nfrom deeper_dive.tts import TTSProvider'+s[b:]
          p.write_text(s)

          p=Path('src/deeper_dive/hosts_screen.py')
          s=p.read_text()
          s=s.replace('from deeper_dive.hosts import HostProfile, HostRelationship, create_host_from_preset, preset_names\n', 'from deeper_dive.hosts import HostProfile, HostRelationship, create_host_from_preset, preset_names\nfrom deeper_dive.kitten_model_manager import KittenModelManager\nfrom deeper_dive.tts_benchmark import TTSBenchmarkService\nfrom deeper_dive.voice_preview import VoicePreviewService\n')
          s=s.replace('            yield Input(placeholder="TTS voice", id="host-tts-voice")\n', '            yield Input(placeholder="TTS voice", id="host-tts-voice")\n            yield Input(placeholder="Kitten model URL (for install)", id="kitten-model-url")\n            yield Input(value="micro", placeholder="Kitten model version", id="kitten-model-version")\n            with Horizontal():\n                yield Button("Discover TTS", name="discover-tts")\n                yield Button("Preview Voice", name="preview-voice")\n                yield Button("Install Kitten", name="install-kitten")\n                yield Button("Benchmark", name="benchmark-tts")\n')
          s=s.replace('            yield Button("Preview Voice", name="preview-voice")\n            yield Static("Status: Ready", id="screen-status")', '            yield Static("Status: Ready", id="screen-status")')
          s=s.replace('            "preview-voice": self.action_preview_voice,\n', '            "preview-voice": self.action_preview_voice,\n            "discover-tts": self.action_discover_tts,\n            "install-kitten": self.action_install_kitten,\n            "benchmark-tts": self.action_benchmark_tts,\n')
          start=s.index('    def action_preview_voice(self) -> None:\n')
          end=s.index('    def _status(self, value: str) -> None:\n', start)
          block='''    def action_discover_tts(self) -> None:\n        providers = sorted(self._app.provider_controller.tts_providers)\n        if not providers:\n            self._status("No TTS providers configured")\n            return\n        provider_id = self.query_one("#host-tts-provider", Input).value.strip()\n        if provider_id not in providers:\n            provider_id = providers[0]\n            self.query_one("#host-tts-provider", Input).value = provider_id\n        provider = self._app.provider_controller.tts(provider_id)\n        voices = provider.voices()\n        if voices and self.query_one("#host-tts-voice", Input).value.strip() not in {v.id for v in voices}:\n            self.query_one("#host-tts-voice", Input).value = voices[0].id\n        self._status(f"TTS providers: {', '.join(providers)} | voices: {', '.join(v.name for v in voices)}")\n\n    def action_preview_voice(self) -> None:\n        provider_id = self.query_one("#host-tts-provider", Input).value.strip()\n        voice = self.query_one("#host-tts-voice", Input).value.strip()\n        if not provider_id or not voice:\n            self._status("Choose a TTS provider and voice first")\n            return\n        try:\n            provider = self._app.provider_controller.tts(provider_id)\n            health = provider.health()\n            if not health.healthy:\n                self._status(f"TTS unavailable: {health.message}")\n                return\n            if voice not in {item.id for item in provider.voices()}:\n                self._status(f"Unknown voice: {voice}")\n                return\n            service = VoicePreviewService(self._app.service.workspaces.data_dir / "voice-previews")\n            path = service.preview(provider, voice=voice)\n        except (KeyError, RuntimeError, ValueError) as exc:\n            self._status(str(exc))\n            return\n        self._status(f"Voice preview cached: {path.name}")\n\n    def action_install_kitten(self) -> None:\n        url = self.query_one("#kitten-model-url", Input).value.strip()\n        version = self.query_one("#kitten-model-version", Input).value.strip() or "micro"\n        manager = KittenModelManager(self._app.service.workspaces.data_dir / "models" / "kitten")\n        if not url:\n            state = manager.state()\n            self._status("Kitten model installed" if state.installed else "Enter a Kitten model URL to install")\n            return\n        try:\n            state = manager.install(url=url, version=version)\n        except (OSError, RuntimeError, ValueError) as exc:\n            self._status(f"Kitten install failed: {exc}")\n            return\n        self._status(f"Kitten model installed: {state.version}")\n\n    def action_benchmark_tts(self) -> None:\n        provider_id = self.query_one("#host-tts-provider", Input).value.strip()\n        voice = self.query_one("#host-tts-voice", Input).value.strip()\n        if not provider_id or not voice:\n            self._status("Choose a TTS provider and voice first")\n            return\n        try:\n            result = TTSBenchmarkService().run(self._app.provider_controller.tts(provider_id), voice=voice)\n        except (KeyError, RuntimeError, ValueError) as exc:\n            self._status(f"Benchmark failed: {exc}")\n            return\n        self._status(f"Benchmark: {result.x_realtime:.2f}x realtime; 20 min ≈ {result.estimated_20_minute_render_seconds:.0f}s")\n\n'''
          s=s[:start]+block+s[end:]
          p.write_text(s)

          p=Path('tests/test_hosts_screen.py')
          s=p.read_text()
          s=s.replace('from deeper_dive.storage.workspace import WorkspaceManager\n', 'from deeper_dive.provider_tui import ProviderController\nfrom deeper_dive.storage.workspace import WorkspaceManager\nfrom deeper_dive.tts import FakeTTSProvider, TTSVoice\nfrom deeper_dive.user_config import UserConfigStore\nfrom deeper_dive.llm import LLMProviderRegistry\n')
          s += '''\n\ndef test_hosts_screen_discovers_and_configures_three_kitten_voices(tmp_path: Path) -> None:\n    asyncio.run(_exercise_three_kitten_voices(tmp_path))\n\n\nasync def _exercise_three_kitten_voices(tmp_path: Path) -> None:\n    service = DeeperDiveService(WorkspaceManager(tmp_path))\n    project = service.create_project("Three voices")\n    kitten = FakeTTSProvider(provider_id="kitten", voices=tuple(TTSVoice(v, v) for v in ("Bella", "Luna", "Leo")))\n    controller = ProviderController(UserConfigStore(tmp_path / "config.json"), LLMProviderRegistry(), {"kitten": kitten})\n    app = DeeperDiveApp(service, provider_controller=controller)\n    async with app.run_test(size=(100, 45)) as pilot:\n        app.current_project_id = project.id\n        app.current_project_name = project.name\n        app.action_navigate("hosts")\n        await pilot.pause()\n        screen = app.screen\n        assert isinstance(screen, HostsScreen)\n        for index, voice in enumerate(("Bella", "Luna", "Leo"), 1):\n            screen.query_one("#host-preset", Input).value = "custom"\n            screen.query_one("#host-name", Input).value = f"Host {index}"\n            screen.action_add_host()\n            screen.query_one("#host-tts-provider", Input).value = "kitten"\n            screen.query_one("#host-tts-voice", Input).value = voice\n            screen.action_save_host()\n        hosts = service.hosts(project.id).list_hosts(project.id)\n        assert [host.tts_voice for host in hosts] == ["Bella", "Luna", "Leo"]\n        screen.action_discover_tts()\n        screen.action_preview_voice()\n        assert kitten.requests\n'''
          p.write_text(s)
          PY
          rm .github/workflows/ralph-dd128.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/deeper_dive/provider_tui.py src/deeper_dive/hosts_screen.py tests/test_hosts_screen.py .github/workflows/ralph-dd128.yml
          git commit -m 'feat: complete host TTS UI controls'
          git push
