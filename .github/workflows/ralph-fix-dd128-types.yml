name: Ralph fix DD-128 types
on:
  push:
    branches: [ralph/dd-128-host-tts-ui-2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/deeper_dive/providers_screen.py')
          s=p.read_text()
          s=s.replace('healthy, message = self.provider_app.provider_controller.tts(name).health()\n                state = "healthy" if healthy else "unhealthy"\n                self._status(f"{name}: {state} - {message}")', 'health = self.provider_app.provider_controller.tts(name).health()\n                state = "healthy" if health.healthy else "unhealthy"\n                self._status(f"{name}: {state} - {health.message}")')
          s=s.replace('self.query_one("#provider-details", Static).update("Voices:\\n" + "\\n".join(voices))', 'self.query_one("#provider-details", Static).update(\n                "Voices:\\n" + "\\n".join(f"{voice.name} [{voice.id}]" for voice in voices)\n            )')
          p.write_text(s)
          PY
          rm .github/workflows/ralph-fix-dd128-types.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'fix: use normalized TTS metadata in provider UI'
          git push
