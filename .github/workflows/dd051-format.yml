name: DD-051 formatter

on:
  push:
    branches: [ralph/dd-051-openai-llm]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-051-openai-llm
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format src/deeper_dive/openai_llm.py tests/test_openai_llm.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/deeper_dive/openai_llm.py tests/test_openai_llm.py
          git commit -m 'style: format DD-051 OpenAI provider'
          git push
