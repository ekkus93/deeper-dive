name: DD-053 formatter
on:
  push:
    branches: [ralph/dd-053-llama-server]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-053-llama-server
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format src/deeper_dive/llama_server_llm.py tests/test_llama_server_llm.py
      - run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/deeper_dive/llama_server_llm.py tests/test_llama_server_llm.py
            git commit -m 'style: format DD-053 llama-server provider'
            git push origin HEAD:ralph/dd-053-llama-server
          fi
