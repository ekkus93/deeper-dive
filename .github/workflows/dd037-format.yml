name: DD-062 wire providers

on:
  push:
    branches: [ralph/dd-062-providers-tui]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-062-providers-tui
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/deeper_dive/tui.py')
          s=p.read_text()
          s=s.replace('from deeper_dive.application.service import DeeperDiveService, ProjectSummary, SourceImportSummary\n', 'from deeper_dive.application.service import DeeperDiveService, ProjectSummary, SourceImportSummary\nfrom deeper_dive.llm import LLMProviderRegistry\nfrom deeper_dive.provider_tui import ProviderController\nfrom deeper_dive.providers_screen import ProvidersScreen\nfrom deeper_dive.user_config import UserConfigStore\n')
          old='''        "providers": lambda: ShellScreen(\n            "providers", "Providers", "Configure language-model and speech providers."\n        ),'''
          s=s.replace(old, '        "providers": lambda: ProvidersScreen(),')
          old='''    def __init__(self, service: DeeperDiveService | None = None) -> None:\n        super().__init__()\n        self.service = service if service is not None else DeeperDiveService(WorkspaceManager())\n        self.current_project_id: str | None = None'''
          new='''    def __init__(\n        self,\n        service: DeeperDiveService | None = None,\n        *,\n        provider_controller: ProviderController | None = None,\n    ) -> None:\n        super().__init__()\n        self.service = service if service is not None else DeeperDiveService(WorkspaceManager())\n        self.provider_controller = provider_controller or ProviderController(\n            UserConfigStore(self.service.workspaces.data_dir / "config.json"),\n            LLMProviderRegistry(),\n            {},\n        )\n        self.current_project_id: str | None = None'''
          if old not in s: raise SystemExit('constructor anchor missing')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/deeper_dive/tui.py
          git commit -m 'DD-062 wire Providers screen into app'
          git push origin HEAD:ralph/dd-062-providers-tui
