name: DD-042 reconcile

on:
  push:
    branches: [ralph/dd-042-reconcile]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-042-reconcile
      - name: Reconcile TODO
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md')
          s=p.read_text()
          for item in [
            'Add OpenAI embeddings adapter.',
            'Add Ollama/local adapter if supported cleanly by selected Ollama API.',
            'Add local sentence-transformer style backend or explicitly defer it by updating spec/TODO with rationale.',
          ]:
            s=s.replace(f'- [ ] {item}', f'- [x] {item}', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEEP_DIVE_TUI_TODO.md
          git commit -m "docs: reconcile DD-042 completion"
          git push
