name: DD-044 formatter
on:
  push:
    branches: [ralph/dd-044-hybrid-retrieval]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-044-hybrid-retrieval
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format src/deeper_dive/hybrid_retrieval.py tests/test_hybrid_retrieval.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/deeper_dive/hybrid_retrieval.py tests/test_hybrid_retrieval.py
            git commit -m "style: format DD-044"
            git push
          fi
