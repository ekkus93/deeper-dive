name: DD-062 lint fixer

on:
  push:
    branches: [ralph/dd-062-providers-tui]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-062-providers-tui
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv sync --frozen
          uv run ruff check --fix src/deeper_dive/tui.py src/deeper_dive/provider_tui.py src/deeper_dive/providers_screen.py tests/test_providers_tui.py
          uv run ruff format src/deeper_dive/tui.py src/deeper_dive/provider_tui.py src/deeper_dive/providers_screen.py tests/test_providers_tui.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/deeper_dive/tui.py src/deeper_dive/provider_tui.py src/deeper_dive/providers_screen.py tests/test_providers_tui.py
          git diff --cached --quiet || git commit -m 'style: fix DD-062 lint'
          git push origin HEAD:ralph/dd-062-providers-tui
