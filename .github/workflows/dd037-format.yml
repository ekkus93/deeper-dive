name: DD-042 formatter

on:
  push:
    branches: [ralph/dd-042-embedding-backends]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-042-embedding-backends
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format src/deeper_dive/embedding_backends.py tests/test_embedding_backends.py
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/deeper_dive/embedding_backends.py tests/test_embedding_backends.py
            git commit -m "style: format DD-042"
            git push
          fi
