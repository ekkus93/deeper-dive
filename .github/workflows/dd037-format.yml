name: DD-074 lint fix

on:
  push:
    branches:
      - ralph/dd-074-safe-fetcher

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-074-safe-fetcher
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check --fix src/deeper_dive/research_fetch.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/deeper_dive/research_fetch.py
          git diff --cached --quiet || git commit -m 'style: fix DD-074 imports'
          git push
