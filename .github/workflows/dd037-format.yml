name: DD-043 reconcile
on:
  push:
    branches: [ralph/dd-043-reconcile]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-043-reconcile
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md'); s=p.read_text()
          for item in ['Select lightweight local vector storage/index strategy appropriate for Python desktop use.','Persist vectors.','Support incremental add/remove/rebuild.','Preserve chunk IDs and provider/model version.']:
            s=s.replace(f'- [ ] {item}',f'- [x] {item}',1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEEP_DIVE_TUI_TODO.md
          git commit -m "docs: reconcile DD-043 completion"
          git push
