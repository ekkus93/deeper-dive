name: DD-037 formatter

on:
  push:
    branches:
      - ralph/dd-037-sources-tui-complete

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff format src/deeper_dive/application/service.py tests/test_sources_tui_completion.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/deeper_dive/application/service.py tests/test_sources_tui_completion.py
          git diff --cached --quiet || git commit -m "style: format DD-037 completion" && git push
