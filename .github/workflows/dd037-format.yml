name: DD-062 TODO reconcile

on:
  push:
    branches: [ralph/reconcile-dd-062]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/reconcile-dd-062
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md')
          s=p.read_text()
          start=s.index('## DD-062 — Providers TUI screen')
          end=s.index('\n---', start)
          section=s[start:end].replace('- [ ] ', '- [x] ')
          s=s[:start]+section+s[end:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/DEEP_DIVE_TUI_TODO.md
          git commit -m 'docs: reconcile DD-062 completion'
          git push origin HEAD:ralph/reconcile-dd-062
