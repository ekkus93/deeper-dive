name: Cleanup DD-022 lock helper
on:
  push:
    branches: [ralph/dd-022-textual-shell]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-022-textual-shell
      - name: Remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/update-lock-dd022.yml
          git commit -m "DD-022 remove temporary lock workflow"
          git push origin HEAD:ralph/dd-022-textual-shell
