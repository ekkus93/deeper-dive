name: DD-053 type fix
on:
  push:
    branches: [ralph/dd-053-llama-server]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/dd-053-llama-server
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/deeper_dive/llama_server_llm.py')
          s = p.read_text()
          old = '''        message = choices[0].get("message")\n        if not isinstance(message, Mapping) or not isinstance(message.get("content"), str):\n            raise LlamaServerError("llama-server response is missing message content")\n        return message["content"]\n'''
          new = '''        message = choices[0].get("message")\n        if not isinstance(message, Mapping):\n            raise LlamaServerError("llama-server response is missing message content")\n        content = message.get("content")\n        if not isinstance(content, str):\n            raise LlamaServerError("llama-server response is missing message content")\n        return content\n'''
          if old not in s:
              raise SystemExit('expected block not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/deeper_dive/llama_server_llm.py
          git commit -m 'fix: narrow llama-server response content type'
          git push origin HEAD:ralph/dd-053-llama-server
