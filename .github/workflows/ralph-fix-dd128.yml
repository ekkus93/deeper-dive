name: Ralph fix DD-128
on:
  push:
    branches: [ralph/dd-128-host-tts-ui-2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check --fix src/deeper_dive/hosts_screen.py src/deeper_dive/provider_tui.py tests/test_hosts_screen.py tests/test_dd128_tts_ui.py
      - run: uv run ruff format src/deeper_dive/hosts_screen.py src/deeper_dive/provider_tui.py tests/test_hosts_screen.py tests/test_dd128_tts_ui.py
      - run: |
          rm .github/workflows/ralph-fix-dd128.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'style: fix DD-128 lint'
          git push
