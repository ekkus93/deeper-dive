name: Ralph reconcile DD-128
on:
  push:
    branches: [ralph/dd-128-reconcile]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/DEEP_DIVE_TUI_TODO.md')
          s=p.read_text(); a=s.index('## DD-128'); b=s.index('# Milestone 14', a)
          s=s[:a]+s[a:b].replace('- [ ]','- [x]')+s[b:]
          p.write_text(s)
          PY
          rm .github/workflows/ralph-dd128-reconcile.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'docs: reconcile DD-128 completion'
          git push
