name: DD-054 TODO reconcile
on:
  push:
    branches: [ralph/reconcile-dd054]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ralph/reconcile-dd054
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/DEEP_DIVE_TUI_TODO.md')
          s = p.read_text()
          start = s.index('## DD-054 — Model role assignments')
          end = s.index('## DD-055 — Structured-output validation/repair')
          block = s[start:end].replace('- [ ] ', '- [x] ')
          p.write_text(s[:start] + block + s[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DEEP_DIVE_TUI_TODO.md
          git commit -m 'docs: reconcile DD-054 completion'
          git push origin HEAD:ralph/reconcile-dd054
